name: builds

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Windows service + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          pip install -r requirements.txt pyinstaller pywin32
      - name: Train detection model (synthetic corpus fallback on CI)
        run: python tools/train_classifier.py
      - name: Build exfiltrap.exe (--onedir; no UPX — AV posture)
        run: pyinstaller packaging/windows/exfiltrap.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test the packaged CLI + model load
        run: |
          dist\exfiltrap\exfiltrap.exe privileges
          dist\exfiltrap\exfiltrap.exe eval --profiles benign --full-only
      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          set ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe
          if not exist "%ISCC%" set ISCC=iscc
          rem Npcap is bundled at packaging time by the maintainer, not CI.
          "%ISCC%" /DMyAppVersion="${{ github.ref_name }}" packaging/windows/exfiltrap.iss || echo "iscc skipped (optional)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-windows
          path: |
            dist/exfiltrap/
            dist/*.exe
          if-no-files-found: error

  linux-service:
    name: Linux service (standalone root binary)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build exfiltrap service (--onedir)
        run: pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test the packaged CLI + model load
        run: |
          ./dist/exfiltrap/exfiltrap privileges
          ./dist/exfiltrap/exfiltrap service --help
          timeout 300 ./dist/exfiltrap/exfiltrap eval --profiles benign --full-only
      - name: Package tarball
        run: tar -czf exfiltrap-linux-service.tar.gz -C dist exfiltrap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-linux-service
          path: exfiltrap-linux-service.tar.gz
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop (deb + portable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Build bundled detection engine (goes INSIDE the deb/portable)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm --distpath dist --workpath build
          ./dist/exfiltrap/exfiltrap privileges
          timeout 300 ./dist/exfiltrap/exfiltrap eval --profiles benign --full-only
          mkdir -p desktop/src-tauri/resources
          rm -rf desktop/src-tauri/resources/exfiltrap-engine
          cp -r dist/exfiltrap desktop/src-tauri/resources/exfiltrap-engine
      - name: Generate platform icons from the source icon
        run: |
          python tools/make_icon.py desktop/src-tauri/icons/icon-source.png
          cd desktop && npm install
          npx tauri icon src-tauri/icons/icon-source.png
      - name: Build the .deb (system webkit stack)
        run: |
          cd desktop
          npm run tauri build -- --bundles deb
      - name: Assemble the portable package from the INSTALLED .deb files
        run: |
          sudo apt install -y ./desktop/src-tauri/target/release/bundle/deb/*.deb
          mkdir -p portable/ExFilTrap
          BIN=$(dpkg -L ex-fil-trap | grep '^/usr/bin/' | head -1)
          cp "$BIN" portable/ExFilTrap/ex-fil-trap
          ENGINE=$(dpkg -L ex-fil-trap | grep 'exfiltrap-engine/exfiltrap$' | head -1)
          test -n "$ENGINE"
          cp -r "$(dirname "$ENGINE")" portable/ExFilTrap/exfiltrap-engine
          cat > portable/ExFilTrap/ExFilTrap <<'LAUNCHER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export EXFILTRAP_SERVICE_BIN="$DIR/exfiltrap-engine/exfiltrap"
          exec "$DIR/ex-fil-trap" "$@"
          LAUNCHER
          chmod +x portable/ExFilTrap/ExFilTrap portable/ExFilTrap/ex-fil-trap \
                   portable/ExFilTrap/exfiltrap-engine/exfiltrap
          # sanity: the portable binary must resolve every lib from the
          # SYSTEM (same story as the deb — proven rendering on Kali)
          ldd portable/ExFilTrap/ex-fil-trap | grep -c "not found" || true
          tar -czf ExFilTrap-portable-linux.tar.gz -C portable ExFilTrap
      - name: Flatten artifact paths (one folder, no digging)
        run: |
          cp desktop/src-tauri/target/release/bundle/deb/*.deb ./
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-desktop-linux
          path: |
            ExFilTrap_*.deb
            ExFilTrap-portable-linux.tar.gz
          if-no-files-found: error

  linux-arch:
    name: Arch package (PKGBUILD — system webkit)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm git rust nodejs npm python python-pip \
            webkit2gtk-4.1 gtk3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe versioning in pkgver()
      - name: makepkg
        run: |
          # makepkg refuses root; build as an unprivileged user. The
          # checkout is placed into srcdir so makepkg builds THIS commit
          # instead of re-cloning the repo.
          useradd -m builder
          mkdir -p /build/src
          cp -r "$GITHUB_WORKSPACE" /build/src/Exfiltrap
          cp "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD" /build/
          cp "$GITHUB_WORKSPACE/packaging/arch/ex-fil-trap.install" /build/
          chown -R builder:builder /build
          su builder -c 'cd /build && makepkg -f --noconfirm'
          cp /build/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - name: Smoke — package metadata is parseable
        run: |
          tar --zstd -xOf *.pkg.tar.zst .PKGINFO | grep -q '^pkgname'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-arch
          path: ./*.pkg.tar.zst
          if-no-files-found: error

  linux-engine-glibc235:
    name: Engine on Ubuntu 22.04 (glibc floor — Flatpak host-side payload)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the engine
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm \
            --distpath dist --workpath build
          ./dist/exfiltrap/exfiltrap privileges
      - name: Package engine payload
        run: tar -czf exfiltrap-engine.tar.gz -C dist exfiltrap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-engine-glibc235
          path: exfiltrap-engine.tar.gz
          if-no-files-found: error

  linux-flatpak:
    name: Flatpak (org.exfiltrap.desktop — runtime webkit)
    runs-on: ubuntu-24.04
    needs: [linux-desktop, linux-engine-glibc235]
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive \
            org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Download payloads
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: downloads
      - name: Build the Flatpak (staged prebuilt payloads)
        env:
          ENGINE_PREBUILT_DIR: /tmp/exfiltrap-engine
        run: |
          mkdir -p /tmp/exfiltrap-engine
          tar -xzf downloads/exfiltrap-engine.tar.gz -C /tmp/exfiltrap-engine
          DEB_FILE=$(find downloads -name 'ExFilTrap_*.deb' | head -1)
          export DEB_FILE
          bash packaging/flatpak/build-flatpak.sh --bundle
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-flatpak
          path: packaging/flatpak/*.flatpak
          if-no-files-found: error
