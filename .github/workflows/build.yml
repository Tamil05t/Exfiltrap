name: builds

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements.txt
      - name: Run the suite
        # The suite previously ran NOWHERE, so a Windows-only regression
        # (winservice's bad `starttype=` kwarg) and a collection crash on
        # Windows (os.geteuid at import) both shipped unnoticed.
        run: python -m pytest tests/ -q

  windows:
    name: Windows service + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The desktop shell is Rust. This job shipped without a Rust toolchain
      # and without a cargo build step, so `desktop/src-tauri/target/release/
      # exfiltrap-desktop.exe` never existed on the runner. The installer's
      # [Files] entry for it carried `skipifsourcedoesntexist`, so the
      # artifact silently contained only the console engine — the Windows
      # product had no window at all, and its Start Menu entry ran
      # `exfiltrap.exe` with no arguments, which prints the CLI help and
      # exits. That is the console window users saw flash and vanish.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          pip install -r requirements.txt pyinstaller pywin32
      - name: Train detection model (synthetic corpus fallback on CI)
        run: python tools/train_classifier.py
      - name: Build exfiltrap.exe (--onedir; no UPX — AV posture)
        run: pyinstaller packaging/windows/exfiltrap.spec --noconfirm --clean --distpath dist --workpath build
      - name: Smoke-test the packaged CLI + model load
        run: |
          dist\exfiltrap\exfiltrap.exe privileges
          dist\exfiltrap\exfiltrap.exe eval --profiles benign --full-only
      - name: Smoke-test the bundled dashboard UI
        shell: pwsh
        run: |
          # The frozen engine must carry the dashboard templates, and the
          # console must expose the new UI shell (view-overview + SSE).
          #
          # $_.FullName is BACKSLASH-separated on Windows, so the path filter
          # must be separator-agnostic. A forward-slash-only pattern
          # ('dashboard/templates') never matched: $idx came back $null on
          # every run and the step died on a bogus "index.html missing from
          # bundle" while the templates were in fact present. Normalise the
          # separators before matching instead of fighting regex escaping
          # inside a YAML block scalar. The failure message now dumps the
          # index.html files that WERE found, so a real packaging regression
          # can never again be masked by a bad pattern.
          $hits = @(Get-ChildItem dist\exfiltrap -Recurse -Filter index.html)
          $idx  = $hits |
                  Where-Object { $_.FullName.Replace('\','/') -match 'dashboard/templates' } |
                  Select-Object -First 1
          if (-not $idx) {
            $seen = if ($hits.Count) {
              ($hits | ForEach-Object { $_.FullName }) -join '; '
            } else { '<no index.html anywhere under dist\exfiltrap>' }
            throw "dashboard index.html missing from bundle (found: $seen)"
          }
          $html = Get-Content -Raw $idx.FullName
          foreach ($needle in @('ExfilTrap','view-overview','api/stream')) {
            if ($html -notmatch [regex]::Escape($needle)) {
              throw "bundled UI is missing '$needle' (stale build?)"
            }
          }
          Write-Host "OK — bundled UI at $($idx.FullName)"
      - name: Build the Tauri desktop shell (the actual application WINDOW)
        shell: pwsh
        run: |
          # This step is the whole difference between "ExFilTrap is an app"
          # and "ExFilTrap is a console program that flashes and closes".
          # tauri.windows.conf.json sets bundle.targets=["nsis"] and
          # resources=[] for this platform, so it is a plain shell build;
          # the installer then ships the exe as {app}\ExFilTrap.exe.
          #
          # The engine is staged into the Tauri resource dir first as
          # insurance: build_windows.bat does the same, because tauri-build
          # validates resource paths at compile time.
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          if (Test-Path desktop/src-tauri/resources/exfiltrap-engine) {
            Remove-Item -Recurse -Force desktop/src-tauri/resources/exfiltrap-engine
          }
          Copy-Item -Recurse dist/exfiltrap desktop/src-tauri/resources/exfiltrap-engine
          cargo build --release --manifest-path desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          $shell = "desktop/src-tauri/target/release/exfiltrap-desktop.exe"
          if (-not (Test-Path $shell)) { throw "desktop shell not produced at $shell" }
          Write-Host "OK — desktop shell at $shell ($((Get-Item $shell).Length) bytes)"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          # exfiltrap.iss degrades to an engine-only installer when the shell
          # is absent, which is right for a local Rust-less build but must
          # never be how a released artifact is produced.
          if (-not (Test-Path "desktop/src-tauri/target/release/exfiltrap-desktop.exe")) {
            throw "refusing to build the installer without the desktop shell"
          }
          # Derive a clean numeric version. On a branch push github.ref_name
          # is "main" (not a version) — fall back to the tauri.conf version so
          # the installer never ships a garbage version string.
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?[0-9]+(\.[0-9]+){1,2}$') {
            $ver = $ref -replace '^v', ''
          } else {
            $ver = (Get-Content desktop/src-tauri/tauri.conf.json |
                    ConvertFrom-Json).version
          }
          Write-Host "Building installer version $ver"
          # Npcap is bundled at packaging time by the maintainer, not CI.
          # -D defines MyAppVersion; the .iss guards it with #ifndef.
          & $iscc "-DMyAppVersion=$ver" packaging/windows/exfiltrap.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist/ExfilTrap-Setup.exe)) {
            throw "ISCC reported success but dist/ExfilTrap-Setup.exe is missing"
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-windows
          path: |
            dist/exfiltrap/
            dist/*.exe
            desktop/src-tauri/target/release/exfiltrap-desktop.exe
          if-no-files-found: error

  linux-service:
    name: Linux service (standalone root binary)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build exfiltrap service (--onedir)
        run: pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm --clean --distpath dist --workpath build
      - name: Smoke-test the packaged CLI + model load
        run: |
          ./dist/exfiltrap/exfiltrap privileges
          ./dist/exfiltrap/exfiltrap service --help
          timeout 300 ./dist/exfiltrap/exfiltrap eval --profiles benign --full-only
      - name: Package tarball
        run: tar -czf exfiltrap-linux-service.tar.gz -C dist exfiltrap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-linux-service
          path: exfiltrap-linux-service.tar.gz
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop (deb + portable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Build bundled detection engine (goes INSIDE the deb/portable)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm --clean --distpath dist --workpath build
          ./dist/exfiltrap/exfiltrap privileges
          timeout 300 ./dist/exfiltrap/exfiltrap eval --profiles benign --full-only
          mkdir -p desktop/src-tauri/resources
          rm -rf desktop/src-tauri/resources/exfiltrap-engine
          cp -r dist/exfiltrap desktop/src-tauri/resources/exfiltrap-engine
      - name: Verify the bundled dashboard UI is the current one
        run: |
          IDX=$(find dist/exfiltrap -path '*dashboard/templates/index.html' | head -1)
          test -n "$IDX" || { echo "dashboard index.html missing"; exit 1; }
          for needle in ExfilTrap view-overview api/stream; do
            grep -q "$needle" "$IDX" || { echo "bundled UI missing '$needle'"; exit 1; }
          done
          echo "OK — bundled UI at $IDX"
      - name: Generate platform icons from the source icon
        run: |
          python tools/make_icon.py desktop/src-tauri/icons/icon-source.png
          cd desktop && npm install
          npx tauri icon src-tauri/icons/icon-source.png
      - name: Build the .deb (system webkit stack)
        run: |
          cd desktop
          npm run tauri build -- --bundles deb
      - name: Assemble the portable package from the INSTALLED .deb files
        run: |
          sudo apt install -y ./desktop/src-tauri/target/release/bundle/deb/*.deb
          mkdir -p portable/ExFilTrap
          BIN=$(dpkg -L ex-fil-trap | grep '^/usr/bin/' | head -1)
          cp "$BIN" portable/ExFilTrap/ex-fil-trap
          ENGINE=$(dpkg -L ex-fil-trap | grep 'exfiltrap-engine/exfiltrap$' | head -1)
          test -n "$ENGINE"
          cp -r "$(dirname "$ENGINE")" portable/ExFilTrap/exfiltrap-engine
          cat > portable/ExFilTrap/ExFilTrap <<'LAUNCHER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export EXFILTRAP_SERVICE_BIN="$DIR/exfiltrap-engine/exfiltrap"
          exec "$DIR/ex-fil-trap" "$@"
          LAUNCHER
          chmod +x portable/ExFilTrap/ExFilTrap portable/ExFilTrap/ex-fil-trap \
                   portable/ExFilTrap/exfiltrap-engine/exfiltrap
          # sanity: the portable binary must resolve every lib from the
          # SYSTEM (same story as the deb — proven rendering on Kali)
          ldd portable/ExFilTrap/ex-fil-trap | grep -c "not found" || true
          tar -czf ExFilTrap-portable-linux.tar.gz -C portable ExFilTrap
      - name: Flatten artifact paths (one folder, no digging)
        run: |
          cp desktop/src-tauri/target/release/bundle/deb/*.deb ./
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-desktop-linux
          path: |
            ExFilTrap_*.deb
            ExFilTrap-portable-linux.tar.gz
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (bundled webkit — runs without FUSE)
    runs-on: ubuntu-22.04        # oldest supported base = glibc floor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build-time Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev curl
      - name: Build engine + shell + AppImage (linuxdeploy, no FUSE)
        run: |
          pip install -r requirements.txt pyinstaller
          bash packaging/appimage/build-appimage.sh dist-appimage
      - name: Smoke — extract and run the bundled engine (no display needed)
        run: |
          APPIMAGE=$(find dist-appimage -name 'ExFilTrap-*.AppImage' | head -1)
          test -n "$APPIMAGE" && test -x "$APPIMAGE"
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null
          # AppRun path (EXFILTRAP_SERVICE_BIN target)
          test -x ./squashfs-root/usr/bin/ex-fil-trap
          ./squashfs-root/usr/bin/exfiltrap-engine/exfiltrap privileges
          ./squashfs-root/usr/bin/exfiltrap-engine/exfiltrap service --help | head -5
          # Tauri resource path (BaseDirectory::Resource ->
          #   $APPDIR/usr/lib/ex-fil-trap/resources/exfiltrap-engine) — must
          # exist or the shell cannot start the engine and the AppImage
          # hangs on the splash screen.
          test -x ./squashfs-root/usr/lib/ex-fil-trap/resources/exfiltrap-engine/exfiltrap
          ./squashfs-root/usr/lib/ex-fil-trap/resources/exfiltrap-engine/exfiltrap privileges
          # Engine must carry the new dashboard UI (the whole point of the
          # rebuild) — fail if the template is missing from the bundle.
          find ./squashfs-root/usr/lib/ex-fil-trap/resources/exfiltrap-engine \
            -name 'index.html' -path '*dashboard/templates*' | grep -q . \
            || { echo "dashboard templates missing from engine"; exit 1; }
          echo "AppImage layout OK"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-appimage
          path: dist-appimage/ExFilTrap-*.AppImage
          if-no-files-found: error

  linux-arch:
    name: Arch package (PKGBUILD — system webkit)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm git rust nodejs npm python python-pip \
            webkit2gtk-4.1 gtk3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe versioning in pkgver()
      - name: makepkg
        run: |
          # makepkg refuses root; build as an unprivileged user. makepkg
          # clones the source itself (git+ source) — the clone is HEAD of
          # main, i.e. exactly this pushed commit.
          useradd -m builder
          mkdir /build
          cp "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD" /build/
          cp "$GITHUB_WORKSPACE/packaging/arch/ex-fil-trap.install" /build/
          chown -R builder:builder /build
          su builder -c 'cd /build && makepkg -f --noconfirm'
          cp /build/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - name: Smoke — package metadata is parseable
        run: |
          tar --zstd -xOf *.pkg.tar.zst .PKGINFO | grep -q '^pkgname'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-arch
          path: ./*.pkg.tar.zst
          if-no-files-found: error

  linux-engine-glibc235:
    name: Engine on Ubuntu 22.04 (glibc floor — Flatpak host-side payload)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the engine
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/linux/exfiltrap-linux.spec --noconfirm --clean \
            --distpath dist --workpath build
          ./dist/exfiltrap/exfiltrap privileges
      - name: Package engine payload
        run: tar -czf exfiltrap-engine.tar.gz -C dist exfiltrap
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-engine-glibc235
          path: exfiltrap-engine.tar.gz
          if-no-files-found: error

  linux-flatpak:
    name: Flatpak (org.exfiltrap.desktop — runtime webkit)
    runs-on: ubuntu-24.04
    needs: [linux-desktop, linux-engine-glibc235]
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive \
            org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Download payloads
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: downloads
      - name: Build the Flatpak (staged prebuilt payloads)
        env:
          ENGINE_PREBUILT_DIR: /tmp/exfiltrap-engine
        run: |
          mkdir -p /tmp/exfiltrap-engine
          tar -xzf downloads/exfiltrap-engine.tar.gz -C /tmp/exfiltrap-engine
          DEB_FILE=$(find downloads -name 'ExFilTrap_*.deb' | head -1)
          export DEB_FILE
          bash packaging/flatpak/build-flatpak.sh --bundle
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-flatpak
          path: packaging/flatpak/*.flatpak
          if-no-files-found: error
