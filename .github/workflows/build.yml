name: builds

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Windows service + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          pip install -r requirements.txt pyinstaller pywin32
      - name: Train detection model (synthetic corpus fallback on CI)
        run: python tools/train_classifier.py
      - name: Build exfiltrap.exe (--onedir; no UPX — AV posture)
        run: pyinstaller packaging/windows/exfiltrap.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test the packaged CLI
        run: dist\exfiltrap\exfiltrap.exe privileges
      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          set ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe
          if not exist "%ISCC%" set ISCC=iscc
          rem Npcap is bundled at packaging time by the maintainer, not CI.
          "%ISCC%" /DMyAppVersion="${{ github.ref_name }}" packaging/windows/exfiltrap.iss || echo "iscc skipped (optional)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-windows
          path: |
            dist/exfiltrap/
            dist/*.exe
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop app (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Generate platform icons from the source icon
        run: |
          python tools/make_icon.py desktop/src-tauri/icons/icon-source.png
          cd desktop && npm install
          npx tauri icon src-tauri/icons/icon-source.png
      - name: Build desktop bundles
        run: |
          cd desktop
          npm run tauri build -- --bundles deb,appimage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfiltrap-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
